# LifeOS CI (PR 2). What each job proves, and what it does not, is in docs/TESTING.md.
#
# Isolation rules, enforced here AND in code:
#   - No job references a secret. There is no `secrets.` expression in this file,
#     and `pull_request` (not `pull_request_target`) means fork PRs get none either.
#   - GITHUB_TOKEN is read-only (permissions: contents: read) and checkout does
#     not persist it.
#   - No job sets a Supabase, Postgres, Stripe or AI variable. The app is built and
#     served in LOCAL-ONLY mode; the AI client falls back to its offline answers.
#   - scripts/run-tests.mjs deletes credential-shaped env vars and blocks every
#     non-loopback connection (DNS, TCP, fetch) before any test code loads.
#   - The migration rehearsal runs on a throwaway local PostgreSQL cluster bound
#     to a unix socket (listen_addresses=''), never a real database.
#   - Browser smokes refuse any BASE that is not localhost.
#   - The only outbound traffic is package installation (npm registry, Ubuntu
#     archive) and Google Fonts at `next build` time. None of it is paid.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NODE_VERSION: "24" # matches the Vercel project (Node 24.x)

jobs:
  static:
    name: Typecheck & lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: TypeScript (whole project, no emit)
        run: npm run typecheck
      - name: ESLint (0 errors; warnings may not grow past today's 5)
        run: npm run lint -- --max-warnings=5

  selftests:
    name: Self-tests · ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: "UTC, today", tz: "UTC", clock: "" }
          - { label: "America/Chicago, today", tz: "America/Chicago", clock: "" }
          # Moved wall clocks catch assertions that silently depend on the run date
          # (the class of bug fixed in 105.25). Future dates only: fixtures are dated
          # in 2026, so a clock before them describes a world that cannot occur.
          - { label: "Chicago, New Year's Eve 23:50", tz: "America/Chicago", clock: "2027-12-31T23:50:00-06:00" }
          - { label: "Chicago, DST spring-forward", tz: "America/Chicago", clock: "2027-03-14T03:30:00-05:00" }
          - { label: "UTC, leap day", tz: "UTC", clock: "2028-02-29T12:00:00Z" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: npm test
        env:
          TZ: ${{ matrix.tz }}
          CLOCK: ${{ matrix.clock }}
        run: |
          args=(--json=test-results/selftests.json)
          if [ -n "$CLOCK" ]; then args+=("--clock=$CLOCK"); fi
          npm test -- "${args[@]}"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selftests-${{ strategy.job-index }}
          path: test-results/selftests.json
          if-no-files-found: ignore
          retention-days: 14

  audits:
    name: Dependency & security audits
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: npm audit (all dependencies, fail on high or critical)
        run: npm audit --audit-level=high
      - name: Security audits (runbook, compat, billing, extract, RLS, secrets, routes, auth, deps)
        run: npm run audit:security
      - name: Release audit (static migration and release-model checks)
        run: npm run release:audit
      - name: Export round-trip verification
        run: npm run release:export

  migrations:
    name: Migration rehearsal · PostgreSQL 16 + pgvector
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install PostgreSQL 16 and the real pgvector extension
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-16 postgresql-16-pgvector
          /usr/lib/postgresql/16/bin/postgres --version
          ls /usr/share/postgresql/16/extension/vector.control
      - name: Rehearse every migration (exit 2 = requirements missing = failure)
        run: npm run release:migrations

  browser:
    name: Browser smokes · shard ${{ matrix.shard }}/3
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      BASE: http://localhost:3111
      CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build the app in local-only mode (no Supabase, AI or Stripe configuration)
        run: npm run build
      - name: Start it on localhost
        run: |
          nohup npx next start -p 3111 > next.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS -o /dev/null "$BASE/today" && exit 0; sleep 1; done
          cat next.log; exit 1
      - run: $CHROME --version
      - name: Route smoke (every production route answers; no /dev route is reachable)
        if: matrix.shard == 1
        run: npm run release:routes
      - name: Run shard ${{ matrix.shard }}
        run: npm run test:browser -- --shard=${{ matrix.shard }}/3
      - if: failure()
        run: tail -200 next.log

  ci-ok:
    name: CI passed
    if: always()
    needs: [static, selftests, audits, migrations, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every job must have succeeded (skipped or cancelled counts as failure)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do [ "$r" = "success" ] || exit 1; done
